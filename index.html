<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Seats — AV 8420</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Los breakpoints de la clase, más un paso intermedio propio en 900px.
     "Usted puede crear un intermedio entre ellos, con una longitud X." */
  tailwind.config = {
    theme: {
      screens: {
        sm: '640px',
        md: '768px',
        bp: '900px',   // <- el intermedio propio
        lg: '1024px',
        xl: '1280px',
        '2xl': '1536px'
      },
      extend: {
        colors: {
          ink: '#0F1116',
          paper: '#E7ECF5',
          muted: '#7B8598',
          hair: '#DDE4EF',
          free: '#D9E1EE',
          busy: '#A8B3C6',
          pick: '#2733F0',
          lime: '#C2F24B',
          night: '#14171F'
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-paper text-ink antialiased">

<!-- ============ ENCABEZADO ============
     Móvil: flecha de volver + título centrado.
     Web (lg): sin flecha, título a la izquierda y el pill de check-in. -->
<header class="sticky top-0 z-30 flex items-center gap-3 border-b border-hair bg-white/85 px-4 py-3 backdrop-blur lg:px-8 lg:py-4">

  <button id="back" data-i18n-aria="back" aria-label="Volver"
          class="grid h-9 w-9 shrink-0 place-items-center rounded-full text-ink transition hover:bg-paper lg:hidden">
    <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>

  <div class="min-w-0 flex-1 text-center lg:flex-none lg:text-left">
    <h1 data-i18n="title" class="truncate text-[17px] font-semibold leading-tight tracking-tight lg:text-2xl">Elegir asientos</h1>
    <p class="truncate text-[11px] tracking-wide text-muted lg:text-xs">BOG · MDE · A320NEO · 13 SEP</p>
  </div>

  <!-- Solo web: en móvil no hay ancho para gastar en esto. -->
  <span class="ml-auto hidden items-center gap-2 rounded-full border border-hair px-3.5 py-2 text-xs font-medium text-muted lg:inline-flex">
    <i class="h-1.5 w-1.5 rounded-full bg-lime"></i><span data-i18n="checkin">Check-in abierto</span>
  </span>

  <button id="lang" aria-label="Español / English"
          class="shrink-0 rounded-full border border-hair px-3 py-1.5 text-xs font-semibold text-muted transition hover:border-pick hover:text-pick">EN</button>

  <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-gradient-to-br from-[#C9CFDD] to-[#8A93A6] text-[11px] font-bold text-white">NC</span>
</header>

<!-- ============ AVIÓN ============
     Es donde ocurre la animación: el pin recorre el fuselaje hasta la fila. -->
<section aria-hidden="true"
         class="relative mx-4 mt-4 overflow-hidden rounded-2xl bg-white lg:mx-8 lg:mt-6 lg:rounded-3xl">

  <!-- Solo web. -->
  <div class="absolute left-5 top-1/2 hidden -translate-y-1/2 flex-col gap-3 lg:flex">
    <button class="grid h-11 w-11 place-items-center rounded-full border border-hair bg-white text-muted transition hover:text-pick">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 9-7 9-7-9z"/></svg>
    </button>
    <button class="grid h-11 w-11 place-items-center rounded-full border border-hair bg-white text-muted transition hover:text-pick">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1.4A3.5 3.5 0 1117.5 18z"/></svg>
    </button>
  </div>

  <div class="stage relative h-24 sm:h-28 bp:h-40 lg:h-48 xl:h-56">
    <svg class="plane absolute inset-0 h-full w-full" viewBox="0 0 900 210" preserveAspectRatio="xMidYMid meet">
      <path class="plane__wing" d="M470 106 L646 32 L680 32 L594 106 Z"/>
      <path class="plane__wing" d="M470 110 L646 184 L680 184 L594 110 Z"/>
      <path class="plane__wing" d="M796 104 L868 28 L890 28 L850 104 Z"/>
      <path class="plane__body" d="M96 105 C96 79 150 66 250 64 L744 64 C814 64 864 84 880 105 C864 126 814 146 744 146 L250 146 C150 144 96 131 96 105 Z"/>
      <path class="plane__nose" d="M38 105 C55 91 75 83 96 81 L96 129 C75 127 55 119 38 105 Z"/>
      <g class="plane__ports" id="ports"></g>
    </svg>

    <span id="zone" class="zone"></span>
    <span id="pin" class="pin"><b id="pinRow">1</b></span>
  </div>
</section>

<!-- ============ SECCIONES ============ -->
<div class="flex items-center gap-4 px-4 py-4 lg:px-8 lg:py-5">
  <span class="hidden text-[11px] font-semibold tracking-[.18em] text-muted lg:block">SECTIONS</span>

  <div id="seg" role="tablist" aria-label="Secciones"
       class="flex flex-1 gap-1 rounded-full border border-hair bg-white p-1 lg:flex-none"></div>

  <!-- Solo web. -->
  <ul class="ml-auto hidden items-center gap-5 text-xs text-muted lg:flex">
    <li class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-free"></i><span data-i18n="legFree">Disponible</span></li>
    <li class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-busy"></i><span data-i18n="legBusy">Ocupado</span></li>
    <li class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-full bg-pick"></i><span data-i18n="legSel">Tu selección</span></li>
  </ul>
</div>

<!-- ============ CUERPO ============
     Móvil: una sola columna. Web (lg): la tarjeta 3D entra a la izquierda. -->
<main class="grid gap-5 px-4 pb-28 lg:grid-cols-[240px_minmax(0,1fr)] lg:gap-6 lg:px-8 lg:pb-10 xl:grid-cols-[280px_minmax(0,1fr)]">

  <!-- Solo web: debajo de lg esta tarjeta no se renderiza. -->
  <aside class="relative hidden flex-col justify-end overflow-hidden rounded-3xl bg-night p-6 text-white lg:flex">
    <span class="absolute left-6 top-6 grid h-11 w-11 place-items-center rounded-xl bg-lime text-night">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor"><path d="M4 4h3v3H4zM10 4h3v3h-3zM16 4h3v3h-3zM4 10h3v3H4zM10 10h3v3h-3zM16 10h3v3h-3zM4 16h3v3H4zM10 16h3v3h-3z"/></svg>
    </span>
    <a href="#" aria-label="Abrir" class="absolute right-6 top-6 text-white/60 transition hover:text-white">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
    <h2 class="text-xl font-semibold tracking-tight">3D Rendering</h2>
    <p data-i18n="promo" class="mt-2 text-[13px] leading-relaxed text-white/55">Recorre la cabina en tres dimensiones antes de elegir. Solo en pantallas grandes.</p>
  </aside>

  <section class="rounded-3xl bg-white p-4 sm:p-5 lg:p-7">
    <header class="mb-5 flex flex-wrap items-baseline justify-between gap-2">
      <h2 id="secName" class="text-[15px] font-semibold tracking-tight lg:text-lg">Sección 1</h2>
      <p id="secStat" class="text-xs text-muted lg:text-[13px]"></p>
    </header>

    <div class="relative flex items-stretch gap-2 lg:gap-4">
      <span class="skin hidden sm:block" aria-hidden="true"></span>
      <div id="map" class="map min-w-0 flex-1"></div>
      <span class="skin hidden sm:block" aria-hidden="true"></span>
    </div>

    <!-- Solo web: en móvil este trabajo lo hace la hoja oscura de abajo. -->
    <footer class="mt-6 hidden items-center gap-4 border-t border-hair pt-5 lg:flex">
      <div id="chipsDesk" class="flex min-h-[34px] flex-1 flex-wrap items-center gap-2"></div>
      <div class="text-right">
        <p data-i18n="total" class="text-[11px] uppercase tracking-wider text-muted">Total</p>
        <strong id="totalDesk" class="text-xl font-semibold tabular-nums tracking-tight">$0</strong>
      </div>
      <button id="ctaDesk" disabled
              class="shrink-0 rounded-full bg-lime px-6 py-3 text-sm font-semibold text-night transition hover:brightness-95 disabled:bg-free disabled:text-muted">
        <span data-i18n="confirm">Confirmar</span> (<span id="nDesk">0</span>)
      </button>
    </footer>
  </section>
</main>

<!-- ============ HOJA MÓVIL ============
     Solo móvil: desde lg no se renderiza. -->
<div class="fixed inset-x-0 bottom-0 z-30 flex items-center gap-3 rounded-t-3xl bg-night px-4 pb-[calc(14px+env(safe-area-inset-bottom))] pt-3 text-white lg:hidden">
  <div id="chipsMob" class="chips-scroll flex min-w-0 flex-1 gap-1.5 overflow-x-auto"></div>
  <strong id="totalMob" class="shrink-0 text-lg font-semibold tabular-nums tracking-tight">$0</strong>
  <button id="ctaMob" disabled
          class="shrink-0 rounded-full bg-lime px-5 py-2.5 text-[13px] font-semibold text-night transition disabled:bg-white/15 disabled:text-white/40">
    <span data-i18n="confirm">Confirmar</span> (<span id="nMob">0</span>)
  </button>
</div>

<div id="toast" role="status" aria-live="polite" class="toast">…</div>

<script src="js/app.js"></script>
</body>
</html>
